<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Data-Oriented Breakdown</title>
  <style>
  body {
    margin: 0;
    overflow: hidden;
    background: #050505;
    font-family: sans-serif;
  }

  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }

  #start-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    z-index: 10;
  }

  button {
    padding: 20px 40px;
    font-size: 20px;
    border: 2px solid white;
    background: transparent;
    color: white;
    cursor: pointer;
  }

  #crosshair {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 20px;
    height: 20px;
    transform: translate(-50%, -50%);
    display: none;
    pointer-events: none;
    z-index: 5;
  }

  #crosshair::before,
  #crosshair::after {
    content: "";
    position: absolute;
    background: white;
  }

  #crosshair::before {
    width: 2px;
    height: 16px;
    left: 9px;
    top: 2px;
  }

  #crosshair::after {
    width: 16px;
    height: 2px;
    left: 2px;
    top: 9px;
  }

  #crosshair.locked {
    transform: translate(-50%, -50%) rotate(45deg) scale(1.2);
  }

  #crosshair.locked::before,
  #crosshair.locked::after {
    background: #ff4444;
  }

  /* ===== HUMAN HUD ===== */

  #human-hud {
    position: fixed;
    left: 32px;
    bottom: 32px;
    display: flex;
    gap: 10px;
    background: rgba(10, 10, 10, 0.38);
    border-radius: 12px;
    padding: 10px 18px 10px 14px;
    z-index: 20;
    border: 1.5px solid rgba(255,255,255,0.13);
    pointer-events: none;
  }

  .human-tile {
    width: 28px;
    height: 28px;
    border-radius: 7px;
    border: 1.5px solid #fff;
    background: rgba(30,30,30,0.38);
    position: relative;
    box-sizing: border-box;
    overflow: hidden;
  }

  .human-tile.filled {
    background: linear-gradient(
      135deg,
      #222 60%,
      #ff3c3c 100%
    );
  }

  .human-tile.filled::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 13px;
    height: 18px;
    background: white;
    border-radius: 6px 6px 8px 8px;
    transform: translate(-50%, -50%);
    animation: human-bounce 1.1s infinite ease-in-out;
  }

  @keyframes human-bounce {
    0%, 100% {
      transform: translate(-50%, -50%) scale(1);
    }

    50% {
      transform: translate(-50%, -54%) scale(1.08, 0.93);
    }
  }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="crosshair"></div>
  <div id="start-overlay"><button id="start">INITIALIZE_SYSTEM</button></div>
  <div id="human-hud"></div>
  <canvas id="game-canvas"></canvas>
  <!-- The rest of your script and HTML goes here -->
</body>
</html>
