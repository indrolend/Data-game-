<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Data-Oriented Breakdown</title>
  <style>
  body {
    margin: 0;
    overflow: hidden;
    background: #050505;
    font-family: sans-serif;
  }

  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }

  #start-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    z-index: 10;
  }

  button {
    padding: 20px 40px;
    font-size: 20px;
    border: 2px solid white;
    background: transparent;
    color: white;
    cursor: pointer;
  }

  #crosshair {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 20px;
    height: 20px;
    transform: translate(-50%, -50%);
    display: none;
    pointer-events: none;
    z-index: 5;
  }

  #crosshair::before,
  #crosshair::after {
    content: "";
    position: absolute;
    background: white;
  }

  #crosshair::before {
    width: 2px;
    height: 16px;
    left: 9px;
    top: 2px;
  }

  #crosshair::after {
    width: 16px;
    height: 2px;
    left: 2px;
    top: 9px;
  }

  #crosshair.locked {
    transform: translate(-50%, -50%) rotate(45deg) scale(1.2);
  }

  #crosshair.locked::before,
  #crosshair.locked::after {
    background: #ff4444;
  }

  /* ===== CONTAINMENT HUD ===== */

#human-hud {
  position: fixed;
  left: 28px;
  bottom: 28px;
  display: flex;
  gap: 12px;
  padding: 14px 18px;
  border-radius: 18px;
  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,0.06),
      rgba(0,0,0,0.22)
    );
  border: 1px solid rgba(255,255,255,0.08);
  backdrop-filter: blur(8px);
  box-shadow:
    0 0 24px rgba(255,120,120,0.08),
    inset 0 0 18px rgba(255,255,255,0.04);
  z-index: 20;
  pointer-events: none;
}

.human-tile {
  width: 34px;
  height: 42px;
  position: relative;
  overflow: hidden;
  border-radius: 10px;

  background:
    linear-gradient(
      180deg,
      rgba(255,235,230,0.12),
      rgba(120,70,70,0.22)
    );

  border: 1px solid rgba(255,255,255,0.12);

  box-shadow:
    inset 0 0 12px rgba(255,255,255,0.04),
    inset 0 -10px 18px rgba(255,90,90,0.05);

  transition:
    background 0.2s,
    transform 0.12s,
    box-shadow 0.2s;
}

.human-tile::after {
  content: "";
  position: absolute;
  inset: 0;

  background:
    repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.03) 0px,
      rgba(255,255,255,0.03) 1px,
      transparent 1px,
      transparent 3px
    );

  opacity: 0.45;
  mix-blend-mode: screen;
}

.human-tile.filled {
  background:
    linear-gradient(
      180deg,
      rgba(255,220,210,0.22),
      rgba(170,80,80,0.32)
    );

  box-shadow:
    0 0 14px rgba(255,120,120,0.18),
    inset 0 0 14px rgba(255,255,255,0.06),
    inset 0 -14px 18px rgba(255,60,60,0.10);
}

.human-tile.filled::before {
  content: "";
  position: absolute;

  left: 50%;
  top: 52%;

  width: 15px;
  height: 22px;

  transform: translate(-50%, -50%);

  background:
    radial-gradient(
      circle at 50% 18%,
      rgba(255,255,255,0.95) 0%,
      rgba(255,255,255,0.95) 18%,
      transparent 20%
    ),
    linear-gradient(
      180deg,
      rgba(255,255,255,0.92),
      rgba(180,240,255,0.85)
    );

  border-radius:
    8px 8px 7px 7px /
    10px 10px 14px 14px;

  filter:
    blur(0.2px)
    drop-shadow(0 0 5px rgba(180,240,255,0.45));

  animation:
    trapped-soul 1.15s infinite ease-in-out;
}

.human-tile.capture-pulse {
  animation:
    containment-pulse 0.32s ease-out;
}

@keyframes trapped-soul {

  0%, 100% {
    transform:
      translate(-50%, -50%)
      scale(1.0, 1.0)
      rotate(-2deg);
  }

  20% {
    transform:
      translate(-48%, -52%)
      scale(1.04, 0.95)
      rotate(1deg);
  }

  50% {
    transform:
      translate(-51%, -56%)
      scale(0.92, 1.08)
      rotate(-1deg);
  }

  80% {
    transform:
      translate(-49%, -51%)
      scale(1.06, 0.94)
      rotate(2deg);
  }
}

@keyframes containment-pulse {

  0% {
    transform: scale(0.85);
    box-shadow:
      0 0 0 rgba(255,80,80,0);
  }

  50% {
    transform: scale(1.18);
    box-shadow:
      0 0 18px rgba(255,80,80,0.38);
  }

  100% {
    transform: scale(1);
    box-shadow:
      0 0 0 rgba(255,80,80,0);
  }
}
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="crosshair"></div>
  <div id="start-overlay"><button id="start">INITIALIZE_SYSTEM</button></div>
  <div id="human-hud"></div>
  <canvas id="game-canvas"></canvas>
  <script type="module" src="./main.js"></script>
</body>
</html>
